<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JewelCase</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #move { position: fixed; inset: 6px; border: 2px dashed rgba(169,220,235,.85); border-radius: 14px; display: none; align-items: flex-end; justify-content: center;
    background: rgba(169,220,235,.07); cursor: move; font: 500 12px "Segoe UI", system-ui, sans-serif; color: #e8ebf1; text-shadow: 0 1px 3px #000; padding-bottom: 12px; box-sizing: border-box; user-select: none; }
  body.moving #move { display: flex; }
</style>
</head>
<body>
<canvas id="stage" aria-label="Vista 3D de la caja de CD"></canvas>
<div id="move">Arrastrá para mover · doble clic para terminar</div>
<script type="module" src="/src/widget/main.ts"></script>
</body>
</html>
