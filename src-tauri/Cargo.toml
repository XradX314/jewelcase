[package]
name = "jewelcase"
version = "0.1.0"
description = "Desktop widget: a 3D jewel case with the CD of the album playing on Spotify"
authors = ["JewelCase contributors"]
license = "MIT"
repository = "https://github.com/XradX314/jewelcase"
edition = "2021"

[lib]
name = "jewelcase_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "net", "io-util", "macros"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Foundation_Collections", "Win32_System_Com"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# Las imágenes se procesan en Rust: sin optimizar (debug) la decodificación, el reescalado y el blur son ~10 veces más lentos
# (el mismo nivel en el crate y en las dependencias: con niveles distintos el enlazado falla por genéricos compartidos)
[profile.dev]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
